<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🐜 Ant Coder: Playable Snake Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    body {
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .stats {
      display: flex;
      gap: 24px;
      font-size: 16px;
      font-weight: 600;
      color: #9ca3af;
      margin-bottom: 12px;
    }
    .stat-val {
      color: #34d399;
      font-size: 20px;
    }
    #game-container {
      position: relative;
      border: 2px solid rgba(52, 211, 153, 0.3);
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(16, 185, 129, 0.15);
      background: #0b0f17;
    }
    canvas {
      display: block;
      border-radius: 10px;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(3, 7, 18, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }
    #overlay h2 {
      font-size: 36px;
      color: #ef4444;
      margin-bottom: 10px;
    }
    #overlay p {
      color: #9ca3af;
      margin-bottom: 20px;
    }
    .btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
      transition: all 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
    }
    .footer {
      margin-top: 14px;
      color: #6b7280;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🐜 Ant Coder: Snake Game</h1>
    <p style="color: #9ca3af; font-size: 13px;">Built Autonomously by AntCoder Multi-Agent Suite</p>
  </div>

  <div class="stats">
    <div>SCORE: <span id="score" class="stat-val">0</span></div>
    <div>BEST: <span id="high-score" class="stat-val">0</span></div>
  </div>

  <div id="game-container">
    <canvas id="canvas" width="440" height="440"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">GAME OVER</h2>
      <p id="overlay-msg">Press Space or button below to play again</p>
      <button class="btn" onclick="restartGame()">PLAY AGAIN</button>
    </div>
  </div>

  <div class="footer">
    Controls: <b>W/A/S/D</b> or <b>Arrow Keys</b> • <b>Space</b> to Restart
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const overlay = document.getElementById('overlay');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let snake = [];
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let food = { x: 5, y: 5 };
    let score = 0;
    let highScore = localStorage.getItem('ant_snake_high') || 0;
    let isGameOver = false;
    let gameLoop = null;

    highScoreEl.innerText = highScore;

    function initGame() {
      snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      scoreEl.innerText = score;
      isGameOver = false;
      overlay.style.display = 'none';
      spawnFood();
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 110);
    }

    function spawnFood() {
      while (true) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        if (!snake.some(segment => segment.x === food.x && segment.y === food.y)) {
          break;
        }
      }
    }

    function update() {
      direction = nextDirection;
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        endGame();
        return;
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.innerText = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.innerText = highScore;
          localStorage.setItem('ant_snake_high', highScore);
        }
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#0b0f17';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = '#151d2a';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Snake
      ctx.shadowColor = '#10b981';
      ctx.shadowBlur = 12;
      snake.forEach((seg, idx) => {
        ctx.fillStyle = idx === 0 ? '#34d399' : '#059669';
        ctx.fillRect(seg.x * GRID_SIZE + 1, seg.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
      });
      ctx.shadowBlur = 0;
    }

    function endGame() {
      isGameOver = true;
      clearInterval(gameLoop);
      overlay.style.display = 'flex';
    }

    function restartGame() {
      initGame();
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && isGameOver) {
        restartGame();
        return;
      }
      if (['ArrowUp', 'KeyW'].includes(e.code) && direction.y === 0) {
        nextDirection = { x: 0, y: -1 };
      } else if (['ArrowDown', 'KeyS'].includes(e.code) && direction.y === 0) {
        nextDirection = { x: 0, y: 1 };
      } else if (['ArrowLeft', 'KeyA'].includes(e.code) && direction.x === 0) {
        nextDirection = { x: -1, y: 0 };
      } else if (['ArrowRight', 'KeyD'].includes(e.code) && direction.x === 0) {
        nextDirection = { x: 1, y: 0 };
      }
    });

    initGame();
  </script>
</body>
</html>
